# Education ERP — Nginx (development single origin, ADR-011).
#   /api/, /healthz, /readyz  -> Django API
#   everything else           -> Next.js
# Runs as non-root (uid 101) on port 8080; pid and temp files live in /tmp (read-only rootfs).
# Production TLS, rate-limit tuning and custom-domain certificates: Phase 18/19.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format json escape=json '{"time":"$time_iso8601","request_id":"$req_id",'
    '"remote_addr":"$remote_addr","method":"$request_method","uri":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
    '"upstream":"$upstream_addr","user_agent":"$http_user_agent"}';
  access_log /dev/stdout json;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 20m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Propagate an upstream X-Request-ID or generate one (Django validates the format).
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    "" $request_id;
  }

  # Conservative per-IP limit for the API in dev; auth-specific zones arrive in Phase 2.
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;

  upstream api_upstream {
    server api:8000;
    keepalive 16;
  }
  upstream web_upstream {
    server web:3000;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;

    # Nginx is the single source of these headers; drop upstream duplicates.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The API trusts only this header for the client IP (CLIENT_IP_HEADER); Nginx overwrites any
    # client-supplied value, so it can't be spoofed (ADR-036 security-event IPs).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $req_id;
    proxy_read_timeout 60s;

    location /api/ {
      limit_req zone=api_per_ip burst=60 nodelay;
      limit_req_status 429;
      proxy_pass http://api_upstream;
    }

    location = /healthz {
      proxy_pass http://api_upstream;
    }

    location = /readyz {
      # Internal probe: production restricts this to private networks (Phase 19).
      proxy_pass http://api_upstream;
    }

    location / {
      proxy_pass http://web_upstream;
    }
  }
}
