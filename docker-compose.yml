# Education ERP — local development stack (Phase 1; least-privilege env since Phase 2).
#   cp .env.example .env && docker compose up -d --build --wait
#   open http://localhost:8080   (single origin through Nginx: / -> web, /api -> api)
#
# Images are pinned to exact versions (docs/TECH_STACK.md). Production compose/CD: Phase 19.
name: erp

# Least-privilege environment (security review H3): no service gets the whole .env file.
# Runtime containers (api, worker, beat) receive ONLY the runtime role's DATABASE_URL; the
# owner URL goes to `migrate` alone and the bootstrap passwords to `postgres` alone.
# Enforced by infra/scripts/check_runtime_secrets.py (CI) and by the Django settings guard.
x-backend-env: &backend_env
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
  PLATFORM_HOSTS: ${PLATFORM_HOSTS:-localhost,127.0.0.1,api}
  TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-localhost}
  TENANT_HOSTS_ENABLED: ${TENANT_HOSTS_ENABLED:-false}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
  APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
  APP_VERSION: ${APP_VERSION:-0.1.0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-console}
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
  DATABASE_URL: ${DATABASE_URL}
  # D4: 0 everywhere. Override only for non-production connection measurements.
  DATABASE_CONN_MAX_AGE: ${DATABASE_CONN_MAX_AGE:-0}
  REDIS_URL: ${REDIS_URL}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3_BUCKET: ${S3_BUCKET}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  # Phase 6 M3: the endpoint browsers use for presigned URLs (empty: the internal endpoint).
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-}
  EMAIL_BACKEND: ${EMAIL_BACKEND}
  EMAIL_HOST: ${EMAIL_HOST}
  EMAIL_PORT: ${EMAIL_PORT}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
  FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS}
  IP_INDEX_KEY: ${IP_INDEX_KEY}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
  MFA_ISSUER: ${MFA_ISSUER:-Education ERP}
  SECURITY_IP_RETENTION_DAYS: ${SECURITY_IP_RETENTION_DAYS:-365}
  SECURITY_NOTIFY_NEW_SIGNIN: ${SECURITY_NOTIFY_NEW_SIGNIN:-platform_staff}
  SECURITY_LOGIN_IP_LIMIT: ${SECURITY_LOGIN_IP_LIMIT:-20}
  # Phase 5 M8: self-service sign-up stays off unless explicitly enabled (ADR-060 Q3).
  TENANCY_SIGNUP_ENABLED: ${TENANCY_SIGNUP_ENABLED:-false}
  PASSWORD_BREACH_CHECK_ENABLED: ${PASSWORD_BREACH_CHECK_ENABLED:-false}
  PASSWORD_BREACH_CHECK_FAIL_CLOSED: ${PASSWORD_BREACH_CHECK_FAIL_CLOSED:-false}

x-backend: &backend
  build:
    context: ./backend
    target: dev
  image: erp-backend:dev
  environment: *backend_env
  user: "10001:10001"
  read_only: true
  tmpfs: ["/tmp"]
  volumes:
    - ./backend:/app:ro
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    # Bootstrap-only secrets: superuser + role passwords live here and nowhere else.
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ERP_DB_NAME: ${ERP_DB_NAME}
      ERP_OWNER_PASSWORD: ${ERP_OWNER_PASSWORD}
      ERP_APP_PASSWORD: ${ERP_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${ERP_DB_NAME}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.12-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  objectstore:
    # S3-compatible dev storage (ADR-029). MinIO no longer publishes community images.
    image: chrislusf/seaweedfs:4.50
    environment: &objectstore_env
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    entrypoint: ["/bin/sh", "/templates/entrypoint.sh"]
    volumes:
      - objectdata:/data
      - ./infra/docker/objectstore:/templates:ro
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  objectstore-init:
    image: chrislusf/seaweedfs:4.50
    environment: *objectstore_env
    depends_on:
      objectstore:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      # Idempotent: create the bucket only if it does not exist yet.
      - >-
        if echo "s3.bucket.list" | weed shell -master=objectstore:9333 | grep -qw "$${S3_BUCKET}";
        then echo "bucket $${S3_BUCKET} already exists";
        else echo "s3.bucket.create -name $${S3_BUCKET}" | weed shell -master=objectstore:9333;
        fi
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  migrate:
    <<: *backend
    # Owner-level bootstrap: migrations, then the permission catalogue and system roles
    # (seed_roles), all as the owner role. The runtime role has no DDL rights (ADR-009) and only
    # SELECT on rbac_permission (O1, rbac.0003); seed_roles refuses to run as erp_app.
    # The ONLY service with the owner URL; ERP_PROCESS_ROLE=migrate lets the settings guard
    # accept it. Also used for owner-only ops commands (key rotation, IP index rebuild).
    environment:
      <<: *backend_env
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL}
      ERP_PROCESS_ROLE: migrate
    entrypoint:
      [
        "/bin/sh",
        "-c",
        'export DATABASE_URL="$$DATABASE_MIGRATION_URL" && python manage.py migrate --noinput && python manage.py seed_roles && python manage.py sync_modules && python manage.py sync_presets && python manage.py sync_tenant_roles',
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      objectstore-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  worker:
    <<: *backend
    command:
      [
        "celery",
        "-A",
        "config",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
        "-Q",
        "default,notifications,reports,imports,finance,ai",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong",
        ]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 20s

  beat:
    <<: *backend
    command:
      ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      worker:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
    image: erp-frontend:dev
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL}
      # Browsers upload files straight to the object store (presigned POST); its public origin
      # joins the CSP connect-src. Empty = uploads blocked (Phase 6 M7).
      FILES_UPLOAD_ORIGIN: ${FILES_UPLOAD_ORIGIN:-}
      NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED:-1}
    read_only: true
    tmpfs:
      - /tmp
      - /app/frontend/.next/cache:uid=1000,gid=1000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/en').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:1.28.3-alpine
    user: "101:101"
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  objectdata:
