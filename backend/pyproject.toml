[project]
name = "erp-backend"
version = "0.1.0"
description = "Education ERP — Django API (modular monolith)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2.8,<6.2",                 # mandated LTS line (ADR-003)
    "djangorestframework>=3.16,<3.19",    # API framework (ADR-003)
    "drf-spectacular>=0.28,<0.31",        # OpenAPI contract (ADR-015)
    "django-environ>=0.12,<0.15",         # 12-factor settings (Phase 1 decision)
    "psycopg[binary]>=3.2,<3.4",          # PostgreSQL 17 driver
    "redis>=5.2,<9",                      # cache / sessions / Celery broker client
    "celery>=5.5,<5.8",                   # background jobs (ADR-003)
    "django-storages[s3]>=1.14.4,<1.15",  # S3-compatible storage backend
    "boto3>=1.38,<2",                     # S3 client used by django-storages
    "structlog>=25.1,<27",                # structured logging (mandated)
    "sentry-sdk[django,celery]>=2.20,<3", # error monitoring (mandated)
    "gunicorn>=23,<27",                   # process manager
    "uvicorn-worker>=0.3,<0.5",           # ASGI worker for gunicorn
    "argon2-cffi>=23.1,<26",              # Argon2 password hashing
    "uuid-utils>=1.2,<1.3",               # UUIDv7 (ADR-012) — used ONLY in apps.core.ids
]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "mypy>=1.15",
    "django-stubs[compatible-mypy]>=5.2,<5.3",
    "djangorestframework-stubs>=3.16",
    "celery-types>=0.23",
    "boto3-stubs[s3]>=1.38",
    "pytest>=8.3",
    "pytest-django>=4.10",
    "pytest-cov>=6",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "import-linter>=2.3",
    "pip-audit>=2.9",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "DJ", "C4", "SIM", "RUF", "PT", "N", "T20"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts and fake secrets are expected; multi-step `pytest.raises` blocks are needed
# for transactional DB assertions (set tenant context, then attempt the forbidden write).
"**/tests/**" = ["S101", "S105", "S106", "S311", "PT012", "PT018", "SIM117"]
"conftest.py" = ["S101"]
"config/settings/*.py" = ["F405", "F403"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["environ.*", "storages.*", "importlinter.*"]
ignore_missing_imports = true

# Tests are type-checked, but test functions/fixtures need not be fully annotated and DB
# driver rows (Optional tuples) are indexed directly.
[[tool.mypy.overrides]]
module = ["*.tests.*", "tests.*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disable_error_code = ["index", "type-arg"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = ["integration: requires the running docker compose stack"]
filterwarnings = ["error::django.utils.deprecation.RemovedInNextVersionWarning"]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*", "config/asgi.py", "config/wsgi.py", "config/settings/dev.py", "config/settings/prod.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_packages = ["apps", "config"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "UUIDv7 library is used only through apps.core.ids (ADR-012)"
type = "forbidden"
source_modules = ["apps", "config"]
forbidden_modules = ["uuid_utils"]
ignore_imports = ["apps.core.ids -> uuid_utils"]

[[tool.importlinter.contracts]]
name = "core is the foundation: it must not import other apps"
type = "forbidden"
source_modules = ["apps.core"]
forbidden_modules = ["apps.identity"]
