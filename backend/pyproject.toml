[project]
name = "erp-backend"
version = "0.1.0"
description = "Education ERP — Django API (modular monolith)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2.8,<5.3",                 # mandated LTS line (ADR-003)
    "djangorestframework>=3.16,<3.19",    # API framework (ADR-003)
    "drf-spectacular>=0.28,<0.31",        # OpenAPI contract (ADR-015)
    "django-environ>=0.12,<0.15",         # 12-factor settings (Phase 1 decision)
    "psycopg[binary]>=3.2,<3.4",          # PostgreSQL 17 driver
    "redis>=5.2,<9",                      # cache / sessions / Celery broker client
    "celery>=5.5,<5.8",                   # background jobs (ADR-003)
    "django-storages[s3]>=1.14.4,<1.15",  # S3-compatible storage backend
    "boto3>=1.38,<2",                     # S3 client used by django-storages
    "structlog>=25.1,<27",                # structured logging (mandated)
    "sentry-sdk[django,celery]>=2.20,<3", # error monitoring (mandated)
    "gunicorn>=23,<27",                   # process manager
    "uvicorn-worker>=0.3,<0.5",           # ASGI worker for gunicorn
    "argon2-cffi>=23.1,<26",              # Argon2 password hashing
    "uuid-utils>=1.2,<1.3",               # UUIDv7 (ADR-012) — used ONLY in apps.core.ids
    "pyotp>=2.10,<3",                     # TOTP RFC 6238 (Phase 2, owner-approved)
    "cryptography>=50.0.2,<51",           # AES-GCM field encryption + HMAC (ADR-031/036)
    "segno>=1.6.6,<2",                    # server-side SVG QR codes (Phase 2, ADR-037 Q5)
    "jsonschema>=4.23,<5",                # config/custom-field validation (ADR-057; was transitive)
    "pyyaml>=6.0.2,<7",                   # preset files (ADR-058; was transitive)
]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "mypy>=1.15",
    "django-stubs[compatible-mypy]>=5.2,<5.3",
    "djangorestframework-stubs>=3.16",
    "celery-types>=0.23",
    "boto3-stubs[s3]>=1.38",
    "pytest>=8.3",
    "pytest-django>=4.10",
    "pytest-cov>=6",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "import-linter>=2.3",
    "pip-audit>=2.9",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "DJ", "C4", "SIM", "RUF", "PT", "N", "T20"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts and fake secrets are expected; multi-step `pytest.raises` blocks are needed
# for transactional DB assertions (set tenant context, then attempt the forbidden write).
# S608: the RLS prototype builds DDL/DML from a fixed tuple of throwaway table names.
"**/tests/**" = ["S101", "S105", "S106", "S311", "S608", "PT012", "PT018", "SIM117"]
"conftest.py" = ["S101"]
"config/settings/*.py" = ["F405", "F403"]
# API error classes are named after their stable Problem Details codes (invalid_credentials, ...).
"apps/identity/errors.py" = ["N818"]
"apps/tenancy/errors.py" = ["N818"]
# Tenant-isolation error names are fixed by the approved Phase 3 plan and ADR-042
# (TenantContextConflict, TenantContextNotApplied, ...).
"apps/core/tenancy/exceptions.py" = ["N818"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["environ.*", "storages.*", "importlinter.*"]
ignore_missing_imports = true

# Tests are type-checked, but test functions/fixtures need not be fully annotated and DB
# driver rows (Optional tuples) are indexed directly.
[[tool.mypy.overrides]]
module = ["*.tests.*", "tests.*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disable_error_code = ["index", "type-arg"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = ["integration: requires the running docker compose stack"]
filterwarnings = ["error::django.utils.deprecation.RemovedInNextVersionWarning"]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*", "config/asgi.py", "config/wsgi.py", "config/settings/dev.py", "config/settings/prod.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_packages = ["apps", "config"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "UUIDv7 library is used only through apps.core.ids (ADR-012)"
type = "forbidden"
source_modules = ["apps", "config"]
forbidden_modules = ["uuid_utils"]
ignore_imports = ["apps.core.ids -> uuid_utils"]

[[tool.importlinter.contracts]]
name = "core is the foundation: it must not import other apps"
type = "forbidden"
source_modules = ["apps.core"]
forbidden_modules = ["apps.identity", "apps.rbac", "apps.audit", "apps.tenancy"]

# Review I2: rbac and identity call each other only through their API/service edges. The
# permission engine, its data and the identity data model must never form an import cycle.
[[tool.importlinter.contracts]]
name = "rbac core (engine, sources, models, registry, seeding) is independent of identity"
type = "forbidden"
source_modules = [
    "apps.rbac.engine",
    "apps.rbac.sources",
    "apps.rbac.models",
    "apps.rbac.registry",
    "apps.rbac.seeding",
    "apps.rbac.role_templates",
    "apps.rbac.signals",
]
forbidden_modules = ["apps.identity"]

[[tool.importlinter.contracts]]
name = "identity data model does not import rbac or audit"
type = "forbidden"
source_modules = ["apps.identity.models", "apps.identity.managers"]
forbidden_modules = ["apps.rbac", "apps.audit"]

# Phase 3 M1 (plan §9.1): tenant context primitives stay at the bottom of the graph, and the
# Phase 2 engine/data model never import the tenancy app (no cycles; sources load from settings).
[[tool.importlinter.contracts]]
name = "core tenancy primitives import no other app"
type = "forbidden"
source_modules = ["apps.core.tenancy"]
forbidden_modules = ["apps.identity", "apps.rbac", "apps.audit", "apps.tenancy"]

[[tool.importlinter.contracts]]
name = "rbac core is independent of tenancy"
type = "forbidden"
source_modules = [
    "apps.rbac.engine",
    "apps.rbac.sources",
    "apps.rbac.models",
    "apps.rbac.registry",
    "apps.rbac.seeding",
    "apps.rbac.role_templates",
    "apps.rbac.signals",
]
forbidden_modules = ["apps.tenancy"]

[[tool.importlinter.contracts]]
name = "identity data model does not import tenancy"
type = "forbidden"
source_modules = ["apps.identity.models", "apps.identity.managers"]
forbidden_modules = ["apps.tenancy"]

[[tool.importlinter.contracts]]
name = "audit core does not import tenancy"
type = "forbidden"
source_modules = ["apps.audit.models", "apps.audit.services", "apps.audit.events"]
forbidden_modules = ["apps.tenancy"]

[[tool.importlinter.contracts]]
name = "audit log core does not import identity"
type = "forbidden"
source_modules = ["apps.audit.models", "apps.audit.services", "apps.audit.events"]
forbidden_modules = ["apps.identity"]
