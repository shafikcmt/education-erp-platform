# Draft v2 (Phase 6, ADR-063): structure levels are organisational only; academic years,
# terms and subjects/courses have their own models. Still a draft to validate with real
# institutions (ADR-060 Q4).
code: coaching.general.v2
institution_type: coaching_center
version: 2
default_for_type: false
name: {en: Coaching center (general), bn: কোচিং সেন্টার (সাধারণ)}
suggested_modules: [academics, students, attendance, fees, online_exams, ext_batch_management]
settings:
  customization.structure_levels:
    - {key: program}
    - {key: batch}
  customization.capabilities:
    academics.credit_based: false
    academics.section_enabled: false
    academics.semester_based: false
    hostel.residential_default: false
  customization.terminology:
    en: {unit.program: Course, unit.batch: Batch, unit.class: Batch, unit.subject: Subject, unit.teacher: Instructor, unit.student: Student, unit.head: Director}
    bn: {unit.program: কোর্স, unit.batch: ব্যাচ, unit.class: ব্যাচ, unit.subject: বিষয়, unit.teacher: শিক্ষক, unit.student: শিক্ষার্থী, unit.head: পরিচালক}
  customization.role_labels:
    en: {institution_admin: Director}
    bn: {institution_admin: পরিচালক}
