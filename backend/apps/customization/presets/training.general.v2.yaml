    bn: {unit.program: কোর্স, unit.batch: ব্যাচ, unit.class: ব্যাচ, unit.subject: মডিউল, unit.teacher: প্রশিক্ষক, unit.student: প্রশিক্ষণার্থী, unit.head: পরিচালক}
  customization.role_labels:
    en: {institution_admin: Director}
    bn: {institution_admin: পরিচালক}
