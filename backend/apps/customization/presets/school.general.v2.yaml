# Draft v2 (Phase 6, ADR-063): structure levels are organisational only; academic years,
# terms and subjects/courses have their own models. Still a draft to validate with real
# institutions (ADR-060 Q4).
code: school.general.v2
institution_type: school
version: 2
default_for_type: true
name: {en: School (general), bn: স্কুল (সাধারণ)}
suggested_modules: [academics, students, staff, attendance, examinations, fees, parent_portal]
settings:
  customization.structure_levels:
    - {key: class}
    - {key: section}
  customization.capabilities:
    academics.credit_based: false
    academics.section_enabled: true
    academics.semester_based: false
    hostel.residential_default: false
  customization.terminology:
    en: {unit.academic_year: Academic year, unit.class: Class, unit.section: Section, unit.subject: Subject, unit.teacher: Teacher, unit.student: Student, unit.head: Head teacher, unit.term: Term}
    bn: {unit.academic_year: শিক্ষাবর্ষ, unit.class: শ্রেণি, unit.section: শাখা, unit.subject: বিষয়, unit.teacher: শিক্ষক, unit.student: শিক্ষার্থী, unit.head: প্রধান শিক্ষক, unit.term: সাময়িক পরীক্ষা}
  customization.role_labels:
    en: {institution_admin: Head teacher}
    bn: {institution_admin: প্রধান শিক্ষক}
