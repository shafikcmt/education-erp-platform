# Draft v2 (Phase 6, ADR-063): structure levels are organisational only; academic years,
# terms and subjects/courses have their own models. Still a draft to validate with real
# institutions (ADR-060 Q4).
# Qawmi, Alia and Hifz conventions differ: expressed as data and overridable, never one board's
# rules in code.
code: madrasa.general.v2
institution_type: madrasa
version: 2
default_for_type: false
name: {en: Madrasa (general), bn: মাদ্রাসা (সাধারণ)}
suggested_modules: [academics, students, staff, attendance, examinations, fees, hostel, ext_hifz_tracking]
settings:
  customization.structure_levels:
    - {key: marhala}
    - {key: jamaat}
  customization.capabilities:
    academics.credit_based: false
    academics.section_enabled: false
    academics.semester_based: false
    hostel.residential_default: true
  customization.terminology:
    en: {unit.marhala: Marhala, unit.jamaat: Jamaat, unit.session: Session, unit.level: Marhala, unit.class: Jamaat, unit.section: Jamaat, unit.subject: Kitab, unit.teacher: Ustad, unit.student: Student, unit.head: Muhtamim}
    bn: {unit.marhala: মারহালা, unit.jamaat: জামাত, unit.session: শিক্ষাবর্ষ, unit.level: মারহালা, unit.class: জামাত, unit.section: জামাত, unit.subject: কিতাব, unit.teacher: উস্তাদ, unit.student: ছাত্র/ছাত্রী, unit.head: মুহতামিম}
  customization.role_labels:
    en: {institution_admin: Muhtamim, hostel_warden: Nazim, teacher: Ustad}
    bn: {institution_admin: মুহতামিম, hostel_warden: নাজিম, teacher: উস্তাদ}
