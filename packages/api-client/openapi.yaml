          maxLength: 255
      required:
      - reason
      - role
    Institution:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        name_i18n:
          readOnly: true
        institution_type:
          allOf:
          - $ref: '#/components/schemas/InstitutionTypeEnum'
          readOnly: true
        settings:
          readOnly: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - archived_at
      - code
      - created_at
      - id
      - institution_type
      - name
      - name_i18n
      - settings
      - updated_at
    InstitutionCreateRequest:
      type: object
      properties:
