          type: string
          format: uuid
          nullable: true
        valid_until:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          default: ''
          maxLength: 255
      required:
      - role
      - scope_type
    TenantProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/TenantStatusEnum'
          readOnly: true
        default_locale:
          type: string
          readOnly: true
        locales:
          type: array
          items:
            type: string
            maxLength: 10
          readOnly: true
        timezone:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
        country:
          type: string
          readOnly: true
        branding:
          readOnly: true
        support_access_requires_approval:
