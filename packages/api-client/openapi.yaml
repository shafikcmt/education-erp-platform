        id:
          type: string
          format: uuid
          readOnly: true
        role:
          type: string
          format: uuid
          readOnly: true
        role_code:
          type: string
          readOnly: true
        granted_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        granted_at:
          type: string
          format: date-time
          readOnly: true
        reason:
          type: string
          readOnly: true
      required:
      - granted_at
      - granted_by
      - id
      - reason
      - role
      - role_code
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        actor_user_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor_type:
          allOf:
          - $ref: '#/components/schemas/ActorTypeEnum'
          readOnly: true
        support_session_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        action:
          type: string
          readOnly: true
        outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeEnum'
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        metadata:
          readOnly: true
        user_agent_summary:
          type: string
          readOnly: true
        request_id:
          type: string
          readOnly: true
        ip_masked:
          type: string
          readOnly: true
      required:
      - action
      - actor_type
      - actor_user_id
      - id
      - ip_masked
      - metadata
      - occurred_at
      - outcome
      - request_id
      - support_session_id
      - target_id
      - target_type
      - user_agent_summary
    Csrf:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    EmailChangeRequest:
      type: object
