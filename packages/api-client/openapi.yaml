          type: object
          additionalProperties:
            $ref: '#/components/schemas/LimitUsage'
      required:
      - addons
      - current_period_end
      - limits
      - modules
      - plan
      - status
      - trial_ends_at
    TokenPasswordRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 256
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
      required:
      - password
      - token
    TokenRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 256
      required:
      - token
    TrialRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 200
        plan:
          type: string
          minLength: 1
          maxLength: 40
        days:
          type: integer
          maximum: 365
          minimum: 1
      required:
      - days
      - plan
      - reason
    WorkflowDraftRequest:
      type: object
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
        subject:
          type: string
          minLength: 1
          maxLength: 80
        name:
          type: string
          minLength: 1
          maxLength: 120
        spec: {}
      required:
      - key
      - name
      - spec
      - subject
    WorkflowInstance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workflow:
          type: string
        version:
          type: integer
        subject:
          type: string
        subject_id:
          type: string
          format: uuid
        state:
          type: string
        sla_due_at:
          type: string
          format: date-time
          nullable: true
        sla_breached_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        actions:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStep'
      required:
      - actions
      - finished_at
      - id
      - sla_breached_at
      - sla_due_at
      - state
      - steps
      - subject
      - subject_id
      - version
      - workflow
    WorkflowStartRequest:
      type: object
      properties:
