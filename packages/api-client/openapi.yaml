      - currency
      - default_locale
      - id
      - locales
      - name
      - slug
      - status
      - support_access_requires_approval
      - timezone
    TenantRegistry:
      type: object
      description: 'Platform view of a tenant: registry fields only (never ``settings``
        or tenant data).'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/TenantStatusEnum'
          readOnly: true
        default_locale:
          type: string
          readOnly: true
        locales:
          type: array
          items:
            type: string
            maxLength: 10
          readOnly: true
        timezone:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
        country:
          type: string
          readOnly: true
        limits:
          type: object
          additionalProperties:
            type: integer
          readOnly: true
        limits_overridden_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        limits_override_reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
