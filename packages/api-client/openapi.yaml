    EmailRequestRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
      required:
      - email
    GrantRequest:
      type: object
      properties:
        role:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 5
          maxLength: 255
      required:
      - reason
      - role
    KindEnum:
      enum:
      - platform
      - template
      - tenant
