        email:
          type: string
          format: email
          readOnly: true
        role:
          type: string
          format: uuid
          readOnly: true
        role_code:
          type: string
          readOnly: true
        scope_type:
          allOf:
          - $ref: '#/components/schemas/ScopeTypeEnum'
          readOnly: true
        institution:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        campus:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        expires_at:
          type: string
          format: date-time
