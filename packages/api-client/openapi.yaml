      - limits_overridden_at
      - limits_override_reason
      - locales
      - name
      - slug
      - status
      - timezone
      - updated_at
    TenantRegistryPage:
      type: object
      properties:
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/TenantRegistry'
      required:
      - next
      - previous
      - results
    TenantRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        name_i18n:
          readOnly: true
        description:
          type: string
          readOnly: true
        is_system:
          type: boolean
          readOnly: true
        template_code:
          type: string
          nullable: true
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - code
      - description
      - id
      - is_system
      - name
      - name_i18n
      - permissions
      - template_code
    TenantRoleCloneRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          pattern: ^[a-z][a-z0-9_]{2,63}$
        name:
          type: string
          minLength: 1
          maxLength: 120
      required:
      - code
      - name
    TenantStatusEnum:
      enum:
      - provisioning
      - active
      - suspended
      - offboarding
      - deleted
      type: string
      description: |-
        * `provisioning` - Provisioning
        * `active` - Active
        * `suspended` - Suspended
        * `offboarding` - Offboarding
        * `deleted` - Deleted
    TenantSubscription:
      type: object
      properties:
        plan:
