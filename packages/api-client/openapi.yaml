components:
  schemas:
    Accepted:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    AccessLevelEnum:
      enum:
      - read_only
      type: string
      description: '* `read_only` - Read only'
    ActorTypeEnum:
      enum:
      - user
      - system
      - support
      - ai
      type: string
      description: |-
        * `user` - User
        * `system` - System
        * `support` - Support session
        * `ai` - AI assistant
    Assignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        role:
          type: string
          format: uuid
          readOnly: true
        role_code:
          type: string
          readOnly: true
        granted_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        granted_at:
          type: string
          format: date-time
          readOnly: true
        reason:
          type: string
          readOnly: true
      required:
      - granted_at
      - granted_by
      - id
      - reason
      - role
      - role_code
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        actor_user_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor_type:
          allOf:
          - $ref: '#/components/schemas/ActorTypeEnum'
          readOnly: true
        support_session_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        action:
          type: string
          readOnly: true
        outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeEnum'
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        metadata:
          readOnly: true
        user_agent_summary:
          type: string
          readOnly: true
        request_id:
          type: string
          readOnly: true
        ip_masked:
          type: string
          readOnly: true
      required:
      - action
      - actor_type
      - actor_user_id
      - id
      - ip_masked
      - metadata
      - occurred_at
      - outcome
      - request_id
      - support_session_id
      - target_id
      - target_type
      - user_agent_summary
    AuditEventPage:
      type: object
      properties:
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
      required:
      - next
      - previous
      - results
    Banner:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        ticket_ref:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
      required:
      - ends_at
      - id
      - starts_at
      - status
      - ticket_ref
    Campus:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        institution:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        name_i18n:
          readOnly: true
        address:
          readOnly: true
        timezone:
          type: string
          readOnly: true
        is_main:
          type: boolean
          readOnly: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - archived_at
      - code
      - created_at
      - id
      - institution
      - is_main
      - name
      - name_i18n
      - timezone
      - updated_at
    CampusCreateRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          minLength: 1
          maxLength: 200
        name_i18n:
          type: object
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 200
        address:
          type: object
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 200
        timezone:
          type: string
          default: ''
          maxLength: 64
      required:
      - code
      - name
