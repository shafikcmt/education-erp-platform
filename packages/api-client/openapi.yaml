components:
  schemas:
    AcademicTermKindEnum:
      enum:
      - term
      - semester
      - trimester
      - quarter
      type: string
      description: |-
        * `term` - Term
        * `semester` - Semester
        * `trimester` - Trimester
        * `quarter` - Quarter
    AcademicYearStatusEnum:
      enum:
      - planned
      - active
      - closed
      type: string
      description: |-
        * `planned` - Planned
        * `active` - Active
        * `closed` - Closed
    Accepted:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    AccessLevelEnum:
      enum:
      - read_only
      type: string
      description: '* `read_only` - Read only'
    ActorTypeEnum:
      enum:
      - user
      - system
      - support
      - ai
      type: string
      description: |-
        * `user` - User
        * `system` - System
        * `support` - Support session
        * `ai` - AI assistant
    AddAddOnRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 200
        addon:
          type: string
          minLength: 1
          maxLength: 40
        valid_until:
          type: string
          format: date-time
          nullable: true
      required:
      - addon
      - reason
    AddOn:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        module:
          type: string
          nullable: true
        archived:
          type: boolean
      required:
      - archived
      - code
      - module
      - name
    AddOnCreateRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          pattern: ^[a-z][a-z0-9_]{1,39}$
        name:
          type: string
          minLength: 1
          maxLength: 120
        module:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
      required:
      - code
      - name
    AdmissionCycleStatusEnum:
      enum:
      - draft
      - open
      - closed
      - archived
      type: string
      description: |-
        * `draft` - Draft
        * `open` - Open
        * `closed` - Closed
        * `archived` - Archived
    Advisor:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        year:
          type: string
          format: uuid
          readOnly: true
        year_name:
          type: string
          readOnly: true
        unit:
          type: string
          format: uuid
          readOnly: true
        unit_name:
          type: string
          readOnly: true
        staff:
          type: string
          format: uuid
          readOnly: true
        staff_name:
          type: string
          readOnly: true
        is_primary:
          type: boolean
          readOnly: true
      required:
      - id
      - is_primary
      - staff
      - staff_name
      - unit
      - unit_name
      - year
      - year_name
    AdvisorCreateRequest:
      type: object
      properties:
        year:
          type: string
          format: uuid
        unit:
          type: string
          format: uuid
        staff:
          type: string
          format: uuid
        is_primary:
          type: boolean
          default: true
      required:
      - staff
      - unit
      - year
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        cycle:
          type: string
          format: uuid
          readOnly: true
        target:
          type: string
          format: uuid
          readOnly: true
        number:
          type: string
          readOnly: true
        applicant_name:
          type: string
          readOnly: true
        applicant_email:
          type: string
          format: email
          readOnly: true
        applicant_phone:
          type: string
          readOnly: true
        date_of_birth:
          type: string
          format: date
          readOnly: true
          nullable: true
        core:
          readOnly: true
        extra:
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          readOnly: true
        workflow_instance_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        merit_rank:
          type: integer
          readOnly: true
          nullable: true
        decision_note:
          type: string
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        responded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - applicant_email
      - applicant_name
      - applicant_phone
      - core
      - cycle
      - date_of_birth
      - decided_at
      - decision_note
      - extra
      - id
      - merit_rank
      - number
      - responded_at
      - score
      - source
      - status
      - submitted_at
      - target
      - workflow_instance_id
    ApplicationCreateRequest:
      type: object
      properties:
        cycle:
          type: string
          format: uuid
        target:
          type: string
          format: uuid
        values:
          type: object
          additionalProperties: {}
      required:
      - cycle
      - target
      - values
    ApplicationStatusEnum:
      enum:
      - draft
      - submitted
      - under_review
      - test_scheduled
      - evaluated
      - offered
      - accepted
      - declined
      - rejected
      - withdrawn
      type: string
      description: |-
        * `draft` - Draft
        * `submitted` - Submitted
        * `under_review` - Under review
        * `test_scheduled` - Test scheduled
        * `evaluated` - Evaluated
        * `offered` - Offered
        * `accepted` - Accepted
        * `declined` - Declined
        * `rejected` - Rejected
        * `withdrawn` - Withdrawn
    Artefact:
      type: object
      description: A version of a rule, form, workflow or template.
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        number:
          type: integer
        status:
          type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        body: {}
      required:
      - body
      - id
      - key
      - name
      - number
      - published_at
      - status
    ArtefactList:
