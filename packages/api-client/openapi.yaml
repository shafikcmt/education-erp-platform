      parameters:
      - in: path
        name: assignment_id
        schema:
          type: string
        required: true
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - platform-rbac
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/platform/users/{user_id}/reactivate/:
    post:
      operationId: platform_users_reactivate_create
      description: |-
        Enforce CSRF on unsafe methods for anonymous callers too (login CSRF; DRF only checks
        authenticated sessions).
      summary: Reactivate a user (step-up)
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - platform-users
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformUser'
          description: ''
  /api/v1/platform/users/{user_id}/sessions/revoke/:
    post:
      operationId: platform_users_sessions_revoke_create
      description: |-
        Enforce CSRF on unsafe methods for anonymous callers too (login CSRF; DRF only checks
        authenticated sessions).
      summary: Sign a user out everywhere (step-up)
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - platform-users
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokedCount'
          description: ''
