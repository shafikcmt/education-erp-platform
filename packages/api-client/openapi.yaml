          nullable: true
        trial_ends_at:
          type: string
          format: date-time
          nullable: true
        current_period_end:
          type: string
          format: date-time
          nullable: true
        addons:
          type: array
          items:
            $ref: '#/components/schemas/SubscribedAddOn'
        modules:
          type: array
          items:
