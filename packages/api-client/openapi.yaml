              schema:
                $ref: '#/components/schemas/SystemHealth'
          description: ''
components:
  schemas:
    Accepted:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    ActorTypeEnum:
      enum:
      - user
      - system
      - support
      - ai
      type: string
      description: |-
        * `user` - User
        * `system` - System
        * `support` - Support session
        * `ai` - AI assistant
    Assignment:
      type: object
