          additionalProperties: {}
      required:
      - subject_id
    WorkflowStep:
      type: object
      properties:
        transition:
          type: string
        from_state:
          type: string
        to_state:
          type: string
        note:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - from_state
      - note
      - to_state
      - transition
    WorkflowTransitionRequest:
      type: object
      properties:
        transition:
          type: string
          minLength: 1
          maxLength: 40
        note:
          type: string
          default: ''
          maxLength: 500
      required:
      - transition
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
